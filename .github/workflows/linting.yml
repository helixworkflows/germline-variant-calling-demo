name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install lintr
        run: |
          Rscript -e 'install.packages("lintr", repos="https://cloud.r-project.org")'

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Lint R scripts
        run: |
          Rscript -e 'files <- list.files(".", pattern="\\.R$", recursive=TRUE, full.names=TRUE); if (length(files)) lintr::lint(files)'